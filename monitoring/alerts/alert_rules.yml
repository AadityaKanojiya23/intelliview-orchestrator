groups:
  - name: intelliview-health
    rules:

      - alert: HighAPIErrorRate
        expr: |
          (
            sum(rate(intelliview_http_requests_total{status=~"5.."}[5m]))
            /
            sum(rate(intelliview_http_requests_total[5m]))
          ) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High API error rate"
          description: "More than 5% of HTTP requests are returning 5xx errors."

      - alert: HighAPIResponseTime
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(intelliview_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High API response time"
          description: "95th percentile API response time is above 1 second."

      - alert: UnhealthyWorkers
        expr: intelliview_workers_unhealthy > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Unhealthy worker detected"
          description: "One or more workers are unhealthy."

      - alert: HighQueueDepth
        expr: intelliview_queue_depth > 100
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High queue depth"
          description: "The Celery queue has more than 100 pending jobs."

      - alert: RedisUnhealthy
        expr: intelliview_redis_health == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is unhealthy"
          description: "Redis health check is reporting an unhealthy state."

      - alert: PostgresUnhealthy
        expr: intelliview_postgres_health == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is unhealthy"
          description: "PostgreSQL health check is reporting an unhealthy state."