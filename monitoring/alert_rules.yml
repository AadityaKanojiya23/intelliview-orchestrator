groups:
  - name: intelliview-api-alerts
    rules:
      - alert: HighAPIErrorRate
        expr: |
          (
            sum(rate(intelliview_http_requests_total{status=~"5.."}[5m]))
            /
            sum(rate(intelliview_http_requests_total[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "High API error rate"
          description: "The API 5xx error rate has been above 5% for 5 minutes."

      - alert: HighAPIResponseTime
        expr: |
          histogram_quantile(
            0.95,
            sum(
              rate(intelliview_http_request_duration_seconds_bucket[5m])
            ) by (le)
          ) > 2
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "High API response time"
          description: "The 95th percentile API response time has exceeded 2 seconds for 5 minutes."