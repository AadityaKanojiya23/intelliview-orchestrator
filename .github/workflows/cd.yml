name: CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy using self-hosted runner
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN_CD }}

      - name: Pull latest Docker images
        shell: powershell
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          Set-Location "C:\intelliview-deployment\intelliview-orchestrator"
          docker compose pull

      - name: Start application
        shell: powershell
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          Set-Location "C:\intelliview-deployment\intelliview-orchestrator"
          docker compose up -d

      - name: Check containers
        shell: powershell
        run: |
          Set-Location "C:\intelliview-deployment\intelliview-orchestrator"
          docker compose ps